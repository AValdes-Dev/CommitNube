services:
  db:
    image: mariadb:11
    container_name: todo_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root_password_secreto
      MARIADB_DATABASE: todo_cloud
      MARIADB_USER: todo_user
      MARIADB_PASSWORD: todo_password_secreto
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build: .
    container_name: todo_web
    restart: always
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=todo_cloud
      - DB_USER=todo_user
      - DB_PASSWORD=todo_password_secreto
      - APP_VERSION=1.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mariadb_data: